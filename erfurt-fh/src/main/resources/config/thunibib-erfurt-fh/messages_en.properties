listWizard.info.text3            = <p>Generate your own personal publication list using data from the bibliography.</p><p>You can use the form below to create personal publication lists directly from the bibliography and export them in various formats. Please feel free to notify us of any missing publications (dating back to 2024) via our <a href='newPublication.xed'>publication submission form</a>, or contact us at <a href='mailto:bibliographie@fh-erfurt.de'>bibliographie@fh-erfurt.de</a> if you would like to request corrections to existing entries.</p> 
